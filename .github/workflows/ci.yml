name: CI
on:
  pull_request: {}
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint + test backend (if present)
        run: |
          if [ -d backend ]; then
            pip install uv
            cd backend
            uv sync --frozen || uv sync || pip install -r requirements.txt || true
            # Standards are ENFORCED, not advisory. Do not append `|| true` to
            # the lines below — that silently passes the build on violations.
            uv run ruff check . || ruff check .
            uv run ruff format --check . || ruff format --check .
            uv run pytest -q || pytest -q
          else
            echo "backend/ not present yet - skipping"
          fi
      - name: NFR-1 read-only guard (mutating tool denylist)
        run: |
          set -e
          # Word boundaries matter: without \b, "checkout" matches unrelated
          # identifiers like svn_checkout inside vendored packages.
          PATTERN='\b(place_food_order|confirm_order|update_food_cart|flush_food_cart|apply_food_coupon|checkout|update_cart|clear_cart|create_order|create_online_payment_order|create_upi_reserve_pay_order|create_wallet_order|add_saved_address|update_drop_zone|update_user_name)\b'
          # Only scan first-party code. Third-party packages are not ours to police,
          # and scanning them produces false positives that block every PR.
          if [ -d backend ] && grep -rnE "$PATTERN" backend --include='*.py' \
               --exclude-dir=.venv --exclude-dir=venv --exclude-dir=site-packages \
               --exclude-dir=node_modules --exclude-dir=__pycache__ \
             | grep -v tests/contracts; then
            echo "::error::Mutating platform tool reference found (NFR-1 violation)"; exit 1
          fi
          echo "NFR-1 guard passed"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint + test + build frontend (if present)
        run: |
          if [ -d frontend ]; then
            cd frontend
            npm ci
            npm run lint --if-present
            npm test --if-present -- --watch=false
            npm run build
          else
            echo "frontend/ not present yet - skipping"
          fi
