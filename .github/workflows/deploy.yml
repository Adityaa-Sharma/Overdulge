name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      REGION: us-central1
      SERVICE: overdulge-backend
      REPO: overdulge
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no backend Dockerfile
        id: check
        run: |
          if [ -f backend/Dockerfile ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "go=false" >> "$GITHUB_OUTPUT"; echo "backend/ not deployable yet - skipping"; fi
      - id: auth
        if: steps.check.outputs.go == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - if: steps.check.outputs.go == 'true'
        uses: google-github-actions/setup-gcloud@v2
      # Runs BEFORE the new revision starts serving, so the container never
      # comes up against a schema it expects but the database does not have.
      # The runner tracks applied versions in public.schema_migrations, so this
      # is a no-op once the database is current.
      - name: Apply database migrations
        if: steps.check.outputs.go == 'true'
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          cd backend
          pip install --quiet uv
          uv run --no-project --with 'psycopg[binary]' python scripts/migrate.py

      - name: Build, push, and deploy to Cloud Run
        if: steps.check.outputs.go == 'true'
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          IMAGE="$REGION-docker.pkg.dev/$PROJECT_ID/$REPO/$SERVICE"

          # Artifact Registry repo (create once; ignore if it already exists).
          gcloud artifacts repositories describe "$REPO" --location "$REGION" >/dev/null 2>&1 \
            || gcloud artifacts repositories create "$REPO" \
                 --repository-format=docker --location "$REGION" \
                 --description="Overdulge backend images"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" backend
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

          # Runtime config. All values are Optional in config.py, so a missing
          # secret degrades a feature rather than failing startup. Custom '@'
          # delimiter so values containing commas/slashes are safe.
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE:${{ github.sha }}" \
            --region "$REGION" --platform managed --allow-unauthenticated \
            --port 8080 --cpu 1 --memory 512Mi --min-instances 0 --max-instances 3 \
            --set-env-vars "^@@^SUPABASE_URL=${{ secrets.SUPABASE_URL }}@@SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}@@SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}@@TOKEN_ENCRYPTION_KEY=${{ secrets.TOKEN_ENCRYPTION_KEY }}@@GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}@@FRONTEND_SETTINGS_URL=https://adityaa-sharma.github.io/Overdulge/"

          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "Deployed: $URL"
          echo "Health:"; curl -fsS "$URL/api/v1/health" && echo " OK" || echo " (health check non-200)"

          # Keep Artifact Registry under the 0.5 GB free tier: delete all but the
          # 5 newest image versions.
          OLD=$(gcloud artifacts docker images list "$IMAGE" --sort-by=~UPDATE_TIME \
                  --format='value(version)' 2>/dev/null | tail -n +6 || true)
          for v in $OLD; do
            gcloud artifacts docker images delete "$IMAGE@$v" --quiet --delete-tags >/dev/null 2>&1 || true
          done
  frontend:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build (if present)
        # Vite inlines VITE_* at BUILD time. Without these the deployed app has
        # undefined Supabase config and hangs on "Checking session…". They are
        # public client config (anon key is safe to ship to the browser), not
        # secrets — the service-role key is never exposed here.
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -d frontend ]; then
            cd frontend && npm ci && npm run build
            # SPA fallback: the app uses client-side routing, but GitHub Pages
            # serves static files — a direct hit or reload on /login (or any
            # route) 404s because no such file exists. Copying index.html to
            # 404.html makes Pages return the SPA for unknown paths so the
            # React router can take over. Without this, every deep link 404s.
            cp dist/index.html dist/404.html
          else
            mkdir -p frontend/dist && echo "Overdulge: coming soon" > frontend/dist/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - uses: actions/deploy-pages@v4
