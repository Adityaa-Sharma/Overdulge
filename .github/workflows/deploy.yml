name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deploy Worker (if present)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -d backend ]; then
            pip install uv && uv tool install workers-py
            cd backend && pywrangler deploy
          else
            echo "backend/ not present yet - skipping"
          fi
  frontend:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build (if present)
        # Vite inlines VITE_* at BUILD time. Without these the deployed app has
        # undefined Supabase config and hangs on "Checking session…". They are
        # public client config (anon key is safe to ship to the browser), not
        # secrets — the service-role key is never exposed here.
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          if [ -d frontend ]; then
            cd frontend && npm ci && npm run build
          else
            mkdir -p frontend/dist && echo "Overdulge: coming soon" > frontend/dist/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - uses: actions/deploy-pages@v4
