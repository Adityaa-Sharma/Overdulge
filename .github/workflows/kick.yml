name: Kick (drain the ready queue)
# The loop is event-driven: the Developer fires on `issues: labeled`. If several
# items are labelled while it is busy, the dev-agent concurrency group keeps only
# one pending run and drops the rest, so those items sit until the nightly sweep
# notices them 24h later. This job re-fires ONE queued item per hour when the
# Developer is genuinely idle, turning the queue into something that drains.
#
# Deliberately plain gh + bash, not a Claude agent: it is pure bookkeeping and
# should not consume Claude subscription usage.
on:
  schedule:
    - cron: "15 * * * *"   # hourly, at :15 past
  workflow_dispatch: {}
concurrency:
  group: kick
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
jobs:
  kick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Re-fire SA review on PRs left unreviewed
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # An unreviewed open PR is stuck for one of two reasons:
          #  a) SA ran before CI concluded and exited (no event brings it back), or
          #  b) the PR branch forked before an agents/sa.md or workflow change, so
          #     SA keeps reviewing with STALE instructions (sa-review.yml checks
          #     out the PR head SHA). Toggling a label does not help (b) — the
          #     re-run still reads the stale branch.
          # Updating the branch fixes BOTH: it merges main in (bringing the current
          # sa.md + workflows into the PR) and fires a fresh pull_request event.
          for n in $(gh pr list --repo "$REPO" --state open --limit 50 \
                       --json number,isDraft --jq '.[] | select(.isDraft | not) | .number'); do
            if [ "$(gh api "repos/$REPO/pulls/$n/reviews" --jq 'length')" != "0" ]; then
              echo "PR #$n: already reviewed."
              continue
            fi
            behind=$(gh api "repos/$REPO/pulls/$n" --jq '.base.ref as $b | .head.sha' >/dev/null 2>&1; \
                     gh api "repos/$REPO/pulls/$n" --jq \
                       'if .mergeable_state == "behind" or .mergeable_state == "dirty" then "behind" else "current" end')
            sha=$(gh api "repos/$REPO/pulls/$n" --jq '.head.sha')
            state=$(gh api "repos/$REPO/commits/$sha/check-runs" \
                      --jq '[.check_runs[] | select(.name != "review")] as $c
                            | if   ($c | length) == 0                 then "none"
                              elif ($c | any(.status != "completed")) then "pending"
                              else "settled" end')
            echo "PR #$n: no review, CI=$state, branch=$behind"
            if [ "$behind" = "behind" ]; then
              # Pull latest main (and current instructions) into the PR; this
              # re-triggers CI + SA on a fresh commit.
              if gh api -X PUT "repos/$REPO/pulls/$n/update-branch" >/dev/null 2>&1; then
                echo "  -> updated branch for #$n (brings in current sa.md + re-fires SA)"
              fi
            elif [ "$state" = "settled" ]; then
              # Branch is current but SA still never reviewed — re-fire via label.
              gh issue edit "$n" --repo "$REPO" --remove-label needs-review >/dev/null 2>&1 || true
              sleep 3
              gh issue edit "$n" --repo "$REPO" --add-label needs-review >/dev/null 2>&1 \
                && echo "  -> re-fired SA review for #$n"
            fi
          done

      - name: Merge PRs the SA reviewed and did not block
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # SA (an LLM) proved unreliable at the FINAL act of merging: it reviews,
          # concludes the PR meets the bar, then sometimes just... stops (#24, #26,
          # #27 all stalled green and unreviewed). Prompt fixes reduced but did not
          # eliminate this. So merging is now deterministic bookkeeping:
          #   SA blocks by submitting a changes-requested review.
          #   If SA ran, CI is green, and there is no blocking review, we merge.
          # The quality gate is unchanged — SA can still reject any PR — but
          # silence no longer stalls the loop.
          for n in $(gh pr list --repo "$REPO" --state open --limit 50 \
                       --json number,isDraft --jq '.[] | select(.isDraft | not) | .number'); do
            pr=$(gh api "repos/$REPO/pulls/$n")
            # SA blocks via the changes-requested LABEL (same-App identity makes
            # blocking reviews impossible), so that label is the veto signal.
            veto=$(echo "$pr" | jq -r '[.labels[].name | select(. == "changes-requested")] | length')
            if [ "$veto" != "0" ]; then
              echo "PR #$n: changes-requested label — SA blocked it, skip"; continue
            fi
            ms=$(echo "$pr" | jq -r .mergeable_state)
            if [ "$ms" = "dirty" ]; then
              # Real merge conflict. Route it to the Developer as rework: the
              # changes-requested label fires dev.yml, and the comment tells it
              # what to do. Without this, conflicted PRs sat forever (no trigger).
              if [ "$(gh api "repos/$REPO/issues/$n/comments" --jq '[.[] | select(.body | startswith("Merge conflict with main"))] | length')" = "0" ]; then
                gh api -X POST "repos/$REPO/issues/$n/comments" \
                  -f body="Merge conflict with main. Developer: merge origin/main into this branch, resolve the conflicts faithfully to both sides' intent, push, then remove the changes-requested label." >/dev/null 2>&1
              fi
              gh issue edit "$n" --repo "$REPO" --add-label changes-requested >/dev/null 2>&1 \
                && echo "PR #$n: dirty — labelled changes-requested to route conflict to Developer"
              continue
            fi
            if [ "$ms" != "clean" ]; then
              echo "PR #$n: mergeable_state=$ms — skip (transient, next hour)"; continue
            fi
            # escalated?
            esc=$(gh api "repos/$REPO/issues/$n" \
                    --jq '[.labels[].name | select(. == "escalation:human")] | length')
            if [ "$esc" != "0" ]; then
              echo "PR #$n: escalation:human — skip"; continue
            fi
            # did the SA gate actually run successfully on the current head?
            sha=$(echo "$pr" | jq -r .head.sha)
            sa_ok=$(gh api "repos/$REPO/commits/$sha/check-runs" \
                      --jq '[.check_runs[] | select(.name == "review" and .conclusion == "success")] | length')
            if [ "$sa_ok" = "0" ]; then
              echo "PR #$n: SA gate has not succeeded on head $sha — skip"; continue
            fi
            echo "PR #$n: CI green, SA ran, no objection -> merging"
            gh pr merge "$n" --repo "$REPO" --squash --delete-branch \
              && echo "  -> merged #$n" \
              || echo "  -> merge failed for #$n (branch protection or race)"
          done

      - name: Re-fire one queued item if the Developer is idle
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 1. Never stack on a running Developer — the dev-agent concurrency
          #    group would just cancel whatever we trigger.
          active=$(gh run list --repo "$REPO" --workflow=dev.yml --limit 15 \
                     --json status \
                     --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')
          if [ "$active" != "0" ]; then
            echo "Developer has $active active run(s) — nothing to do."
            exit 0
          fi

          # 2. Never re-fire while an item is claimed; that claim is the lock.
          claimed=$(gh issue list --repo "$REPO" --label in-progress --state open \
                      --json number --jq 'length')
          if [ "$claimed" != "0" ]; then
            echo "$claimed issue(s) still claimed (in-progress) — nothing to do."
            exit 0
          fi

          # 3. Choose one eligible issue: unassigned, and not blocked / escalated.
          #    Bugs before features; within each, P0 then P1 then P2 then the rest;
          #    oldest first so nothing starves.
          pick() {
            gh issue list --repo "$REPO" --label "$1" --state open --limit 100 \
              --json number,labels,createdAt,assignees \
              --jq '[ .[]
                      | select((.assignees | length) == 0)
                      | select([.labels[].name]
                          | any(. == "blocked" or . == "escalation:human" or . == "in-progress")
                          | not)
                      | {number, createdAt, prio:
                          ( [.labels[].name] as $l
                            | if   ($l | index("P0")) then 0
                              elif ($l | index("P1")) then 1
                              elif ($l | index("P2")) then 2
                              else 3 end ) } ]
                    | sort_by(.prio, .createdAt) | .[0].number // empty'
          }

          for label in ready-for-fix ready-for-dev; do
            num="$(pick "$label" || true)"
            if [ -n "${num:-}" ]; then
              # Guard against the pick->merge race: an earlier step of this same
              # kick run may have merged a PR that closed this issue seconds ago.
              # Re-firing a closed issue sends an Opus Dev off to re-implement
              # already-merged work.
              if [ "$(gh api "repos/$REPO/issues/$num" --jq .state)" != "open" ]; then
                echo "Issue #$num closed since selection — stripping stale '$label' label instead."
                gh issue edit "$num" --repo "$REPO" --remove-label "$label" >/dev/null 2>&1 || true
                continue
              fi
              echo "Re-firing issue #$num via label '$label'."
              gh issue edit "$num" --repo "$REPO" --remove-label "$label"
              sleep 5   # let the removal register as its own event
              gh issue edit "$num" --repo "$REPO" --add-label "$label"
              echo "Done — the Developer workflow should now trigger for #$num."
              exit 0
            fi
          done

          echo "Queue is empty: nothing ready, unassigned and unblocked."
