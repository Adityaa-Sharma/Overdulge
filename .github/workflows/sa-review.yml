name: SA Agent - PR Gate
on:
  pull_request:
    # `labeled` and `reopened` matter for recovery, not just the happy path:
    #  - SA can run before CI concludes and exit without reviewing. Nothing
    #    else re-triggers it, so the PR would sit unreviewed forever.
    #  - sweep.yml and kick.yml both recover stalled PRs by toggling a
    #    `needs-review` label, which does nothing unless `labeled` is listed.
    types: [opened, ready_for_review, synchronize, reopened, labeled]
concurrency:
  group: sa-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  review:
    # Only `needs-review` may re-trigger via a label. Without this guard SA's own
    # attempt:1 -> 2 -> 3 labels would re-fire SA on every increment — a runaway
    # self-triggering loop burning subscription usage.
    if: >
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' ||
       github.event.label.name == 'needs-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: "overdulge"
          prompt: |
            Read agents/sa.md. Execute Mode B (PR gate) for PR
            #${{ github.event.pull_request.number }}. Wait for CI checks on the
            head SHA to conclude (poll with gh, up to 15 minutes) before the
            substantive review. If the PR or its linked issue is labeled
            escalation:human, exit immediately.
          claude_args: "--max-turns 40 --allowedTools Bash,Read,Glob,Grep"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
