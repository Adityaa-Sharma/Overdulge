name: QA Agent - Weekly Regression
on:
  schedule:
    - cron: "30 20 * * 6"   # Sunday 02:00 IST
  workflow_dispatch: {}
concurrency:
  group: qa-regression
  cancel-in-progress: false
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app.outputs.token }}
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: "overdulge"
          prompt: |
            Read agents/qa.md and execute Mode B (Weekly regression).
          claude_args: "--max-turns 80 --allowedTools Bash,Read,Glob,Grep,WebFetch"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
