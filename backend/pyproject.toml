[project]
name = "overdulge-backend"
version = "0.1.0"
description = "Overdulge backend — FastAPI on Cloudflare Python Workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.5",
    "cryptography>=41.0",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27,<1",
    "uvicorn>=0.30",
    "langchain>=0.3",
    "langchain-groq>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "psycopg[binary]>=3.2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
